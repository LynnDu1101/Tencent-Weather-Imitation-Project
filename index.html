<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腾讯天气</title>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div class="containermax">
    <div class="container0">
      <div class="header">
        <div class="container">
          <div class="header-left">
            <img src="./img/weatherheadLogo.webp" alt="logo" id="logo">
          </div>
          <div class="header-right">
            <a href="//www.qq.com" style="font-size: 14px;">腾讯网首页</a>
            <a href="#" style="font-size: 14px;">无障碍浏览</a>
            <div class="show">
              <img src="./img/1630660669191.png" class="show-icon" alt="">
              <p class="txt-cur-location">陕西省 西安市</p>
              <p class="attention">[添加关注]</p>
            </div>
            <div class="search">
              <input class="search-input" type="text" placeholder="搜索市、区、县等">
            </div>
          </div>
        </div>
      </div>
      <div class="content-wrap">
        <p id="pubTime">中央气象台15:10发布</p>
        <div id="ct-main">
          <p id="temperature">23°</p>
          <p id="weather">阴</p>
          <div class="idlevel">
            <p class="info-aqi">
              <span class="aqi-icon"></span>
              <span class="aqi-num">26</span>
              <span class="aqi-level">优</span>
            </p>
          </div>
        </div>
        <div class="other">
          <p class="item">
            <img src="./img/箭头.png" alt="">
            <span class="txt">北风&nbsp;1-3级</span>
          </p>
          <p class="item">
            <img src="./img/雨滴.png" alt="">
            <span class="txt">湿度&nbsp;95%</span>
          </p>
          <p class="item">
            <img src="./img/气压.png" alt="">
            <span class="txt">气压&nbsp;966hPa</span>
          </p>
          <p class="item">
            <img src="./img/小车.png" alt="">
            <span class="txt">限行&nbsp;1和6</span>
          </p>
        </div>
        <div class="picture">
          <img src="./img/多云.png" alt="">
        </div>
      </div>
    </div>
    <div class="container1">
      1
    </div>
    <div class="container2">
      2
    </div>
